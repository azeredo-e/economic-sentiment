[project]
name = "llm-econ-text"
version = "0.1.0"
description = "LLM-based textual indices for Brazilian macroeconomic forecasting (extension of Almeida, 2024)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "gdown>=5.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_econ_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
